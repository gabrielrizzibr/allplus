<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('appdata').textContent); // tenant allnet (só assets na AWS)
  const TYPE_COLORS = {video:'--t-video',meet:'--t-meet',live:'--t-live',exam:'--t-exam',
    post:'--t-post',slideshow:'--t-slideshow',link:'--t-link'};
  const $=(s,r=document)=>r.querySelector(s);
  const el=(tag,cls)=>{const e=document.createElement(tag); if(cls)e.className=cls; return e;};

  // --- helpers ---
  function fmtDur(s){
    if(s==null) return '';
    s=Number(s); if(!isFinite(s)||s<=0) return '';
    const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=Math.floor(s%60);
    const p=n=>String(n).padStart(2,'0');
    return h? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
  }
  function typeBadge(type){
    const b=el('span','type'); b.textContent=type||'?';
    b.style.background=`var(${TYPE_COLORS[type]||'--t-other'})`;
    return b;
  }
  // ---- content row (sem badges aws/google) ----
  function contentRow(ct){
    const li=el('li','citem');
    li.appendChild(typeBadge(ct.type));
    const name=el('span','c-name'); name.textContent=ct.name||'(sem nome)';
    if(!ct.resolved){ name.classList.add('un'); name.title='Conteúdo referenciado mas não encontrado na tabela content'; name.textContent='⚠ '+name.textContent; }
    li.appendChild(name);
    const d=fmtDur(ct.duration);
    if(d){const s=el('span','dur'); s.textContent=d; li.appendChild(s);}
    if(ct.url){
      const a=el('a','open'); a.textContent='Abrir ▶'; a.href=ct.url; a.target='_blank'; a.rel='noopener';
      li.appendChild(a);
    } else if(!ct.smartplayer){
      const s=el('span','nolink'); s.textContent='sem link'; li.appendChild(s);
    }
    li._name=(ct.name||'').toLowerCase();
    return li;
  }

  // ---- module (bloco fixo, sem abrir/fechar) ----
  function moduleBlock(m, isOrphan){
    const div=el('div', isOrphan?'module orphan':'module');
    const head=el('div','m-head');
    const title=el('span','m-title');
    title.textContent=isOrphan?'⚠ Sem módulo':(m.name||'(módulo sem nome)');
    head.appendChild(title);
    const cnt=el('span','count spacer'); cnt.textContent=`${m.contents.length} aula${m.contents.length!=1?'s':''}`;
    head.appendChild(cnt);
    div.appendChild(head);
    const ul=el('ul','clist');
    const rows=[];
    m.contents.forEach(ct=>{const r=contentRow(ct); ul.appendChild(r); rows.push(r);});
    div.appendChild(ul);
    div._name=(isOrphan?'sem módulo':(m.name||'')).toLowerCase();
    div._titleEl=title;
    div._rows=rows;
    return div;
  }

  // ---- course (abre e mostra TODO o conteúdo de uma vez) ----
  function courseBlock(c){
    const det=el('details','course');
    const sum=el('summary');
    sum.innerHTML='<span class="caret">▶</span>';
    const title=el('span','c-title'); title.textContent=c.name||'(curso sem nome)';
    sum.appendChild(title);
    if(c.status){const b=el('span','badge'); b.textContent=c.status; sum.appendChild(b);}
    const nMods=c.modules.length;
    let nCont=c.modules.reduce((a,m)=>a+m.contents.length,0)+ (c.orphanContents?c.orphanContents.length:0);
    const cnt=el('span','count spacer');
    cnt.textContent=`${nMods} módulo${nMods!=1?'s':''} · ${nCont} aula${nCont!=1?'s':''}`;
    sum.appendChild(cnt);
    det.appendChild(sum);
    const wrap=el('div','m-wrap');
    const mods=[];
    c.modules.forEach(m=>{const mb=moduleBlock(m,false); wrap.appendChild(mb); mods.push(mb);});
    if(c.orphanContents && c.orphanContents.length){
      const mb=moduleBlock({name:'Sem módulo',contents:c.orphanContents}, true);
      wrap.appendChild(mb); mods.push(mb);
    }
    det.appendChild(wrap);
    det._name=(c.name||'').toLowerCase();
    det._titleEl=title;
    det._mods=mods;
    return det;
  }

  // ---- render ----
  let COURSES=[];
  function renderTree(){
    const tree=$('#tree'); tree.innerHTML=''; COURSES=[];
    const courses=DATA.courses||[];
    if(!courses.length){ $('#status').textContent=''; tree.innerHTML='<div class="empty">Nenhum asset.</div>'; return; }
    const frag=document.createDocumentFragment();
    courses.forEach(c=>{const cb=courseBlock(c); frag.appendChild(cb); COURSES.push(cb);});
    tree.appendChild(frag);
    applyFilter();
  }

  // ---- busca ----
  function applyFilter(){
    const qRaw=$('#q').value;
    const q=qRaw.trim().toLowerCase();
    const active=!!q;
    $('#clear').style.display=q?'block':'none';
    let visCourses=0, visContents=0;
    for(const course of COURSES){
      const cTxt=!q || course._name.includes(q);
      let courseVisible=false;
      for(const mod of course._mods){
        const mTxt=cTxt || (!!q && mod._name.includes(q));
        let modVisible=false;
        for(const row of mod._rows){
          const match=!q || cTxt || mTxt || row._name.includes(q);
          row.hidden=!match;
          row.classList.toggle('hit', !!q && row._name.includes(q));
          if(match){modVisible=true; visContents++;}
        }
        mod.hidden=!modVisible;
        mod._titleEl.classList.toggle('hit', !!q && mod._name.includes(q));
        if(modVisible) courseVisible=true;
      }
      course.hidden=!courseVisible;
      course.open=active && courseVisible;
      course._titleEl.classList.toggle('hit', !!q && course._name.includes(q));
      if(courseVisible) visCourses++;
    }
    const st=$('#status');
    if(active) st.textContent=`busca "${qRaw.trim()}" → ${visCourses} curso(s) · ${visContents} conteúdo(s)`;
    else st.textContent=`allnet · ${COURSES.length} cursos · clique num curso para abrir tudo.`;
  }

  // ---- init ----
  renderTree();
  let deb;
  $('#q').addEventListener('input', ()=>{clearTimeout(deb); deb=setTimeout(applyFilter,120);});
  $('#clear').onclick=()=>{$('#q').value=''; applyFilter();};
})();
</script>
